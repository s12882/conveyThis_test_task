server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 100M;

    # Docker's embedded DNS. Resolving `app` via a variable (below) instead
    # of a static fastcgi_pass forces nginx to re-resolve it periodically,
    # rather than caching the app container's IP for the life of the nginx
    # process — otherwise recreating `app` (rebuild, restart) without also
    # restarting `webserver` leaves nginx pointing at a dead IP (502).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # nginx's 60s default is easy to exceed on a large upload over a
        # slow connection — bumped so a genuinely large-but-valid upload
        # fails on the size limit, not on an unrelated timeout.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
