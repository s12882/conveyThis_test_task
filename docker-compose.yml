services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: conveythis-app
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [conveythis]

  webserver:
    image: nginx:1.27-alpine
    container_name: conveythis-webserver
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [conveythis]

  mysql:
    image: mysql:8.4
    container_name: conveythis-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [conveythis]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: conveythis-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [conveythis]

  clamav:
    image: clamav/clamav:1.5
    container_name: conveythis-clamav
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 600s
    networks: [conveythis]

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: conveythis-queue-worker
    command: php artisan queue:work database --queue=scans,default --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks: [conveythis]

  rabbitmq-consumer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: conveythis-rabbitmq-consumer
    command: php artisan rabbitmq:consume-file-deletions
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [conveythis]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: conveythis-scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks: [conveythis]

networks:
  conveythis:
    driver: bridge

volumes:
  mysql-data:
  clamav-db:
